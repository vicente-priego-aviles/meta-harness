site_name: meta-harness-factory
site_description: Software factory con Claude Code, memoria en Obsidian y ahorro de tokens
docs_dir: docs/guia
site_dir: site
site_url: https://vicente-priego-aviles.github.io/meta-harness-factory/
repo_url: https://github.com/vicente-priego-aviles/meta-harness-factory
repo_name: meta-harness-factory

theme:
  name: material
  language: es
  logo: assets/logo.svg
  icon:
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: "Modo automático (según el sistema). Pulsa para modo claro"
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: "Modo claro. Pulsa para modo oscuro"
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: "Modo oscuro. Pulsa para modo automático"
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.instant
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

extra_css:
  - assets/stylesheets/extra.css

extra_javascript:
  - assets/javascripts/mermaid-ampliar.js

plugins:
  - search:
      lang: es
  - callouts
  - glightbox:
      touchNavigation: true
      zoomable: true
      draggable: true
      skip_classes: [no-ampliar]
  - git-revision-date-localized:
      type: date
      locale: es
      fallback_to_build_date: true

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: false
      title: En esta página
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true

nav:
  - Inicio: index.md
  - Tutorial:
      - tutorial/index.md
      - Requisitos: tutorial/requisitos.md
      - Instalar en un proyecto: tutorial/instalar.md
      - Tu primer cambio (FTD): tutorial/primer-ftd.md
  - Uso diario:
      - uso/index.md
      - Responder: uso/responder.md
      - FTD, cambios claros: uso/ftd.md
      - ASDD, cambios con decisiones: uso/asdd.md
      - Riesgo y revisión: uso/riesgo-revision.md
  - Arquitectura:
      - arquitectura/index.md
      - Las cinco capas: arquitectura/capas.md
      - El brain en Obsidian: arquitectura/brain.md
      - Hooks y guardarraíles: arquitectura/hooks.md
      - Módulos del catálogo: arquitectura/modulos.md
  - Referencia:
      - referencia/index.md
      - Skills: referencia/skills.md
      - Subagentes: referencia/subagentes.md
      - Hooks: referencia/hooks.md
      - Scripts: referencia/scripts.md
      - Configuración (.mh.json): referencia/configuracion.md
      - Instalador (mh): referencia/instalador.md
  - Tokens:
      - tokens/index.md
      - Salida de Maven (mvnq): tokens/mvnq.md
      - Presupuesto y medidas: tokens/presupuesto.md
      - Resultados medidos: tokens/resultados.md
  - Ayuda:
      - ayuda/index.md
      - Mantenimiento: ayuda/mantenimiento.md
      - Problemas frecuentes: ayuda/problemas.md
      - Glosario: ayuda/glosario.md
